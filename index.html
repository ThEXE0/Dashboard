<script src="https://cdnjs.cloudflare.com/ajax/libs/lucide/0.263.1/lucide.min.js"></script>
<style>
:root{color-scheme:dark;--bg:#0a0e1f;--card:#111733;--card2:#161d40;--bd:#242c57;--tx:#e8ebff;--mu:#8e97c4;--pr:#8b5cf6;--pr2:#a78bfa;--ok:#22c55e;--no:#ef4444;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
#app{display:flex;min-height:100vh}
aside{width:230px;background:#0c1128;border-right:1px solid var(--bd);padding:16px 10px;position:sticky;top:0;height:100vh;flex-shrink:0;transition:.2s;overflow:hidden}
aside.c{width:64px}aside.c .lb{display:none}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;padding:4px 10px 16px}
.logo{justify-content:center;padding:4px 0 16px}.lg{width:150px;max-width:100%;border-radius:22px;transition:.2s}aside.c .lg{width:40px;border-radius:10px}
.nav{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;color:var(--mu);cursor:pointer;margin-bottom:4px;white-space:nowrap}
.nav:hover{background:var(--card)}.nav.on{background:var(--pr);color:#fff}
main{flex:1;min-width:0;padding:20px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
h1{font-size:22px;margin:0;flex:1}h3{margin:0 0 12px;font-size:15px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px}
.grid{display:grid;gap:14px}.g4{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.kpi .v{font-size:22px;font-weight:700;margin-top:4px}.kpi .l{color:var(--mu);font-size:12px}
.btn{background:var(--pr);color:#fff;border:0;border-radius:10px;padding:9px 14px;font:inherit;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn.s{background:var(--card2);border:1px solid var(--bd);color:var(--tx)}.btn.d{background:#3a1220;color:#fca5a5}.btn.sm{padding:5px 8px;font-size:12px}
.btn:hover{filter:brightness(1.12)}
label{display:block;font-size:12px;color:var(--mu)}
input,select,textarea{width:100%;margin-top:4px;background:#0a0f26;border:1px solid var(--bd);border-radius:10px;color:var(--tx);padding:9px 10px;font:inherit}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pr);border-color:transparent}
.f{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}.full{grid-column:1/-1}
.split{display:grid;grid-template-columns:1fr 340px;gap:16px;align-items:start}
.sum{position:sticky;top:16px}
.row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dashed var(--bd)}.row:last-child{border:0}
.big{border-radius:14px;padding:12px;background:var(--card2);margin-top:10px}.big b{font-size:22px;display:block}
.pos{color:var(--ok)}.neg{color:var(--no)}.mu{color:var(--mu)}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:760px}th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--bd);white-space:nowrap}th{color:var(--mu);font-size:12px}
.img{width:38px;height:38px;border-radius:8px;object-fit:cover;background:var(--card2);display:inline-flex;align-items:center;justify-content:center;color:var(--mu)}
.tag{padding:2px 9px;border-radius:99px;font-size:11px;background:var(--card2);border:1px solid var(--bd)}
.tag.Aprovado,.tag.Comprado{color:var(--ok)}.tag.Descartado{color:var(--no)}.tag.Em{color:var(--pr2)}
.bar{height:10px;border-radius:6px;background:var(--pr);min-width:2px}.bar.n{background:var(--no)}
.pl{display:flex;gap:8px;flex-wrap:wrap}.pl label{flex:1;min-width:130px;border:1px solid var(--bd);border-radius:12px;padding:10px;cursor:pointer;color:var(--tx)}
.pl input{width:auto;margin:0 6px 0 0}.pl label:has(input:checked){border-color:var(--pr);background:#1d1650}
.flt{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.flt>*{flex:1;min-width:120px;margin:0}
#mb{padding:12px 14px;border-radius:12px;min-width:52px;min-height:48px;justify-content:center}#mb svg{width:28px;height:28px}
#toast{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--card2);border:1px solid var(--pr);padding:10px 16px;border-radius:12px;opacity:0;transition:.3s;pointer-events:none;z-index:9}
#toast.on{opacity:1}
@media(max-width:860px){.split{grid-template-columns:1fr}.sum{position:static}aside{position:fixed;z-index:5;height:100%;left:0}aside.c{width:0;padding:0;border:0}main{padding:14px 14px 14px 14px;margin-left:0}#app{display:block}main{padding-top:14px}}
</style></head><body>

const $=s=>document.querySelector(s);
const NAV=[["dash","layout-dashboard","Dashboard"],["prod","package","Produtos"],["forn","truck","Fornecedores"],["comp","shopping-cart","Compras"],["sim","calculator","Simulador de Margem"],["rel","bar-chart-3","Relatórios"],["cfg","settings","Configurações"]];
const DEF={mlc:13,mlp:16,shp:0,fixMl:0,fixShp:0,tax:0,pack:0,freight:0,minM:20,ret:"BRL"};
let S={prods:[],forn:[],comp:[],cfg:{...DEF}};
try{const r=localStorage.getItem("mn");if(r){const o=JSON.parse(r);S={...S,...o,cfg:{...DEF,...(o.cfg||{})}}}}catch(e){}
let DB=null,base="",SYNC="Somente neste navegador",last={},timer=null;
const COLS=["prods","forn","comp"];
const recs=()=>{const r={};COLS.forEach(c=>S[c].forEach(x=>r[c+"/"+x.id]=x));r["cfg/main"]=S.cfg;return r};
async function push(){if(!DB)return;try{const r=recs(),cur={};
  for(const k in r){const j=JSON.stringify(r[k]);cur[k]=j;if(last[k]!==j)await DB.doc(base+k).set(JSON.parse(j))}
  for(const k in last)if(!(k in cur))await DB.doc(base+k).delete();
  last=cur;SYNC="Sincronizado com a sua conta"}catch(e){SYNC="Erro ao sincronizar: "+(e.message||e.code||e)}}
const save=()=>{try{localStorage.setItem("mn",JSON.stringify(S))}catch(e){toast("Erro ao salvar no navegador")}clearTimeout(timer);timer=setTimeout(push,700)};
(async()=>{try{const c=await claude.use("db"),u=await claude.use("user");if(!c||!u)return;DB=c;base="data/users/"+await u.id()+"/";
  const n={cfg:{...DEF}};let any=false;
  for(const col of COLS){const q=await DB.collection(base+col).get();n[col]=q.docs.map(d=>d.data());if(q.size)any=true}
  const cs=await DB.collection(base+"cfg").get();cs.docs.forEach(d=>{if(d.id=="main"){n.cfg={...DEF,...d.data()};any=true}});
  if(any){S={...S,...n};try{localStorage.setItem("mn",JSON.stringify(S))}catch(e){}last={};const r=recs();for(const k in r)last[k]=JSON.stringify(r[k]);SYNC="Sincronizado com a sua conta"}
  else await push();
  if(!/f$|sim/.test(route))render()}catch(e){SYNC="Somente neste navegador"}})();
const uid=()=>Math.random().toString(36).slice(2,10);
const N=v=>{v=parseFloat(String(v).replace(",","."));return isFinite(v)?v:0};
const brl=n=>(+n||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const pc=n=>(+n||0).toFixed(1).replace(".",",")+"%";
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const PL={mlc:"Mercado Livre Clássico",mlp:"Mercado Livre Premium",shp:"Shopee"};
const ST=["Em análise","Aprovado","Comprado","Descartado"];
let route="dash",arg=null,collapsed=innerWidth<860,tmp={};
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("on");setTimeout(()=>e.classList.remove("on"),2200)}
function calc(p){
  const price=Math.max(0,N(p.price)),cost=Math.max(0,N(p.cost));
  const com=price*N(p.pct)/100,tax=price*N(p.taxp)/100;
  const total=cost+com+N(p.fixed)+N(p.freight)+N(p.pack)+tax+N(p.other);
  const profit=price-total;
  const o=cost+N(p.fixed)+N(p.freight)+N(p.pack)+N(p.other),den=1-(N(p.pct)+N(p.taxp)+N(S.cfg.minM))/100;
  return{price,cost,com,tax,total,profit,margin:price>0?profit/price*100:0,roi:total>0?profit/total*100:0,minPrice:den>0?o/den:null}}
function pct(pl){return pl=="mlp"?S.cfg.mlp:pl=="shp"?S.cfg.shp:S.cfg.mlc}
function fix(pl){return pl=="shp"?S.cfg.fixShp:S.cfg.fixMl}
function newP(){const c=S.cfg;return{id:uid(),name:"",plat:"mlc",pct:c.mlc,fixed:c.fixMl,freight:c.freight,pack:c.pack,taxp:c.tax,other:0,cost:"",price:"",minQty:1,status:"Em análise",offers:[],hist:[]}}
const fn=id=>S.forn.find(f=>f.id==id)?.name||"-";
function go(r,a){route=r;arg=a||null;render();scrollTo(0,0)}
function render(){
  $("#sb").className=collapsed?"c":"";
  $("#sb").innerHTML=`<div class="logo"><img class="lg" alt="MeuNegócio" src="${LOGO}"></div>`+NAV.map(n=>`<div class="nav ${route.startsWith(n[0])?"on":""}" onclick="go('${n[0]}');if(innerWidth<860)collapsed=true;render()"><i data-lucide="${n[1]}"></i><span class="lb">${n[2]}</span></div>`).join("")+`<div class="nav" onclick="collapsed=!collapsed;render()"><i data-lucide="panel-left"></i><span class="lb">Recolher</span></div>`;
  $("#m").innerHTML=`<div class="top"><button id="mb" class="btn s sm" onclick="collapsed=!collapsed;render()"><i data-lucide="menu"></i></button>${V[route]()}`;
  lucide.createIcons();
}
/* ---------- views ---------- */
const V={};
const head=(t,btn)=>`<h1>${t}</h1>${btn||""}</div>`;
V.dash=()=>{const P=S.prods,cs=P.map(p=>({p,c:calc(p)})),n=cs.length;
  const avg=f=>n?cs.reduce((a,x)=>a+f(x.c),0)/n:0,cnt=s=>P.filter(p=>p.status==s).length;
  const k=[["Produtos",n],["Fornecedores",S.forn.length],["Margem média",pc(avg(c=>c.margin))],["Lucro médio/un.",brl(avg(c=>c.profit))],["Em análise",cnt("Em análise")],["Aprovados",cnt("Aprovado")],["Descartados",cnt("Descartado")]];
  const top=[...cs].sort((a,b)=>b.c.margin-a.c.margin).slice(0,8),mx=Math.max(1,...top.map(x=>Math.abs(x.c.margin)));
  return head("Dashboard",`<button class="btn" onclick="go('prodf',null)"><i data-lucide="plus"></i>Adicionar Produto</button>`)+
  `<div class="grid g4">${k.map(x=>`<div class="card kpi"><div class="l">${x[0]}</div><div class="v">${x[1]}</div></div>`).join("")}</div>
  <div class="card" style="margin-top:14px"><h3>Melhores oportunidades (margem líquida)</h3>${top.length?top.map(x=>`<div style="margin:8px 0"><div class="row" style="border:0;padding:0"><span>${esc(x.p.name||"Sem nome")}</span><span class="${x.c.profit>=0?"pos":"neg"}">${pc(x.c.margin)} · ${brl(x.c.profit)}</span></div><div class="bar ${x.c.profit<0?"n":""}" style="width:${Math.abs(x.c.margin)/mx*100}%"></div></div>`).join(""):`<p class="mu">Cadastre produtos para ver os gráficos.</p>`}</div>`};
function flt(){return tmp.f||(tmp.f={q:"",forn:"",plat:"",cat:"",st:"",mn:"",mx:""})}
V.prod=()=>{const F=flt(),cats=[...new Set(S.prods.map(p=>p.cat).filter(Boolean))];
  const L=S.prods.map(p=>({p,c:calc(p)})).filter(({p,c})=>(!F.q||(p.name+p.sku).toLowerCase().includes(F.q.toLowerCase()))&&(!F.forn||p.forn==F.forn)&&(!F.plat||p.plat==F.plat)&&(!F.cat||p.cat==F.cat)&&(!F.st||p.status==F.st)&&(F.mn===""||c.margin>=N(F.mn))&&(F.mx===""||c.margin<=N(F.mx)));

  <div class="tw"><table><tr><th></th><th>Nome</th><th>Fornecedor</th><th>Custo</th><th>Venda</th><th>Comissão</th><th>Frete</th><th>Lucro</th><th>Margem</th><th>Plataforma</th><th>Status</th><th></th></tr>

const I=(id,l,v,t="text",x="")=>`<div><label>${l}<input id="${id}" type="${t}" value="${esc(v)}" ${x}></label></div>`;
const NI=(id,l,v)=>I(id,l,v,"number",'step="0.01" min="0" oninput="upd()"');
function sumHTML(c){const r=(a,b,cl="")=>`<div class="row"><span class="mu">${a}</span><span class="${cl}">${b}</span></div>`;
  return `<h3>Resumo de Custos</h3>${r("Custo do produto",brl(c.cost))}${r("Comissão ("+pc(c.pctv)+")",brl(c.com))}${r("Tarifa fixa",brl(c.fixed))}${r("Frete estimado",brl(c.freight))}${r("Embalagem",brl(c.pack))}${r("Impostos",brl(c.tax))}${r("Outros custos",brl(c.other))}${r("<b>Custo total</b>","<b>"+brl(c.total)+"</b>")}
  <div class="big"><span class="mu">Lucro estimado</span><b class="${c.profit>=0?"pos":"neg"}">${brl(c.profit)}</b></div>
  <div class="grid" style="grid-template-columns:1fr 1fr"><div class="big"><span class="mu">Margem líquida</span><b class="${c.profit>=0?"pos":"neg"}" style="font-size:18px">${pc(c.margin)}</b></div><div class="big"><span class="mu">ROI</span><b class="${c.profit>=0?"pos":"neg"}" style="font-size:18px">${pc(c.roi)}</b></div></div>
  <div class="big"><span class="mu">Preço mínimo p/ margem de ${pc(S.cfg.minM)}</span><b style="font-size:18px">${c.minPrice==null?"Inviável com estas taxas":brl(c.minPrice)}</b></div>
  ${c.price>0&&c.margin<N(S.cfg.minM)?`<p class="neg" style="margin:10px 0 0">Margem abaixo da mínima desejada.</p>`:""}`}
function fillC(p){const c=calc(p);return{...c,pctv:N(p.pct),fixed:N(p.fixed),freight:N(p.freight),pack:N(p.pack),other:N(p.other)}}
function rd(sim){const g=i=>document.getElementById(i)?.value;const p={plat:document.querySelector("input[name=plat]:checked")?.value||"mlc"};
  ["price","cost","pct","fixed","freight","pack","taxp","other"].forEach(k=>p[k]=g("f_"+k));return p}
function upd(){const p=rd();$("#sum").innerHTML=sumHTML(fillC(p));
  const el=$("#cmp");if(el)el.innerHTML=cmpHTML(p)}
function setPlat(pl){document.getElementById("f_pct").value=pct(pl);document.getElementById("f_fixed").value=fix(pl);upd()}
const plSel=v=>`<div class="pl full">${Object.entries(PL).map(([k,n])=>`<label><input type="radio" name="plat" value="${k}" ${k==v?"checked":""} onchange="setPlat('${k}')">${n}<br><span class="mu">comissão padrão ${pc(pct(k))}</span></label>`).join("")}</div>`;
const costFields=p=>NI("f_cost","Custo de aquisição (R$)",p.cost)+NI("f_price","Preço estimado de venda (R$)",p.price)+NI("f_pct","Comissão (%)",p.pct)+NI("f_fixed","Tarifa fixa (R$ estimativa)",p.fixed)+NI("f_freight","Frete estimado (R$)",p.freight)+NI("f_pack","Embalagem (R$)",p.pack)+NI("f_taxp","Impostos (% sobre venda)",p.taxp)+NI("f_other","Outros custos (R$)",p.other);
V.prodf=()=>{const ed=S.prods.find(x=>x.id==arg),p=tmp.p&&tmp.p.id==(ed?.id||tmp.p.id)&&tmp.pn==arg?tmp.p:(ed?JSON.parse(JSON.stringify(ed)):newP());tmp.p=p;tmp.pn=arg;
  return head(ed?"Editar produto":"Novo produto")+`<div class="split"><div class="card"><div class="f">
  ${I("f_name","Nome do produto *",p.name)}${I("f_sku","SKU / código interno",p.sku||"")}${I("f_cat","Categoria",p.cat||"")}
  <div><label>Fornecedor<select id="f_forn"><option value="">—</option>${S.forn.map(f=>`<option value="${f.id}" ${f.id==p.forn?"selected":""}>${esc(f.name)}</option>`).join("")}</select></label></div>
  ${I("f_link","Link de compra",p.link||"")}${I("f_minQty","Quantidade mínima de compra",p.minQty,"number",'min="1"')}
  <div><label>Status<select id="f_status">${ST.map(s=>`<option ${s==p.status?"selected":""}>${s}</option>`).join("")}</select></label></div>
  <div><label>Foto<input id="f_img" type="file" accept="image/*" onchange="photo(this)"></label>${p.img?`<img class="img" style="margin-top:6px" src="${p.img}">`:""}</div>
  <div class="full"><label>Plataforma</label>${plSel(p.plat)}</div>${costFields(p)}
  <div class="full"><label>Observações<textarea id="f_notes" rows="2">${esc(p.notes||"")}</textarea></label></div></div>
  <h3 style="margin-top:16px">Cotações de fornecedores</h3><div id="offers">${offersHTML(p)}</div><button class="btn s sm" onclick="addOffer()"><i data-lucide="plus"></i>Adicionar cotação</button>
  ${p.hist?.length?`<h3 style="margin-top:16px">Histórico de custo</h3>${p.hist.slice(-5).reverse().map(h=>`<div class="row"><span class="mu">${h.d}</span><span>${brl(h.v)}</span></div>`).join("")}`:""}
  <div style="margin-top:16px;display:flex;gap:8px"><button class="btn" onclick="saveP()"><i data-lucide="save"></i>Salvar</button><button class="btn s" onclick="tmp.p=null;go('prod')">Cancelar</button></div></div>
  <div class="card sum" id="sum">${sumHTML(fillC(p))}</div></div>`};
function offersHTML(p){const mn=Math.min(...p.offers.map(o=>N(o.price)||Infinity));return p.offers.map((o,i)=>`<div class="f" style="margin-bottom:8px;align-items:end"><div><label>Fornecedor<select onchange="tmp.p.offers[${i}].forn=this.value">${S.forn.map(f=>`<option value="${f.id}" ${f.id==o.forn?"selected":""}>${esc(f.name)}</option>`).join("")}</select></label></div><div><label>Preço (R$)<input type="number" step="0.01" value="${esc(o.price)}" onchange="tmp.p.offers[${i}].price=this.value;$('#offers').innerHTML=offersHTML(tmp.p)"></label></div><div><button class="btn s sm" onclick="useOffer(${i})">${N(o.price)==mn?"✔ Menor preço · ":""}Usar custo</button> <button class="btn d sm" onclick="tmp.p.offers.splice(${i},1);keep();$('#offers').innerHTML=offersHTML(tmp.p)">×</button></div></div>`).join("")||`<p class="mu">Nenhuma cotação. Adicione para comparar preços.</p>`}
function keep(){const g=i=>document.getElementById(i)?.value,p=tmp.p;["name","sku","cat","forn","link","minQty","status","notes"].forEach(k=>{if(document.getElementById("f_"+k))p[k]=g("f_"+k)});Object.assign(p,rd())}
function addOffer(){if(!S.forn.length)return toast("Cadastre um fornecedor primeiro");keep();tmp.p.offers.push({forn:S.forn[0].id,price:""});go("prodf",arg)}
function useOffer(i){keep();tmp.p.cost=tmp.p.offers[i].price;tmp.p.forn=tmp.p.offers[i].forn;go("prodf",arg)}
function photo(el){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement("canvas"),s=Math.min(1,160/Math.max(im.width,im.height));c.width=im.width*s;c.height=im.height*s;c.getContext("2d").drawImage(im,0,0,c.width,c.height);keep();tmp.p.img=c.toDataURL("image/jpeg",.7);go("prodf",arg)};im.src=r.result};r.readAsDataURL(f)}
function saveP(){keep();const p=tmp.p;
  if(!p.name.trim())return toast("Informe o nome do produto");
  if(N(p.cost)<0||N(p.price)<0||N(p.pct)<0||N(p.pct)>=100)return toast("Valores inválidos");
  const i=S.prods.findIndex(x=>x.id==p.id),old=S.prods[i];
  if(!old||N(old.cost)!=N(p.cost))p.hist=[...(p.hist||[]),{d:new Date().toLocaleDateString("pt-BR"),v:N(p.cost)}];
  if(i>=0)S.prods[i]=p;else S.prods.push(p);save();tmp.p=null;go("prod");toast("Produto salvo")}
/* suppliers */
V.forn=()=>head("Fornecedores",`<button class="btn" onclick="go('fornf',null)"><i data-lucide="plus"></i>Adicionar Fornecedor</button>`)+
  `<div class="card tw"><table><tr><th>Nome</th><th>Empresa</th><th>Tipo</th><th>País</th><th>Prazo</th><th>Produtos</th><th></th></tr>${S.forn.map(f=>`<tr><td>${esc(f.name)}</td><td>${esc(f.co)}</td><td>${f.tipo}</td><td>${esc(f.pais)}</td><td>${esc(f.prazo)}</td><td>${S.prods.filter(p=>p.forn==f.id).length}</td><td><button class="btn s sm" onclick="go('fornd','${f.id}')"><i data-lucide="eye"></i></button> <button class="btn s sm" onclick="go('fornf','${f.id}')"><i data-lucide="pencil"></i></button> <button class="btn d sm" onclick="del('forn','${f.id}')"><i data-lucide="trash-2"></i></button></td></tr>`).join("")||`<tr><td colspan="7" class="mu">Nenhum fornecedor cadastrado.</td></tr>`}</table></div>`;
const FF=[["name","Nome do fornecedor *"],["co","Empresa"],["wa","WhatsApp"],["email","E-mail"],["site","Site ou link da loja"],["end","Endereço"],["pais","País de origem"],["prazo","Prazo de entrega"],["min","Pedido mínimo"]];
V.fornf=()=>{const f=S.forn.find(x=>x.id==arg)||{tipo:"nacional"};return head(arg?"Editar fornecedor":"Novo fornecedor")+`<div class="card"><div class="f">${FF.map(([k,l])=>I("g_"+k,l,f[k]||"")).join("")}<div><label>Tipo<select id="g_tipo"><option value="nacional" ${f.tipo=="nacional"?"selected":""}>Nacional</option><option value="internacional" ${f.tipo=="internacional"?"selected":""}>Internacional</option></select></label></div><div class="full"><label>Observações<textarea id="g_obs" rows="2">${esc(f.obs||"")}</textarea></label></div></div><div style="margin-top:14px;display:flex;gap:8px"><button class="btn" onclick="saveF()"><i data-lucide="save"></i>Salvar</button><button class="btn s" onclick="go('forn')">Cancelar</button></div></div>`};
function saveF(){const f={id:arg||uid()};[...FF.map(x=>x[0]),"tipo","obs"].forEach(k=>f[k]=$("#g_"+k).value);
  if(!f.name.trim())return toast("Informe o nome do fornecedor");if(f.email&&!/^\S+@\S+\.\S+$/.test(f.email))return toast("E-mail inválido");
  const i=S.forn.findIndex(x=>x.id==f.id);if(i>=0)S.forn[i]=f;else S.forn.push(f);save();go("forn");toast("Fornecedor salvo")}
V.fornd=()=>{const f=S.forn.find(x=>x.id==arg);if(!f)return head("Fornecedor não encontrado");const ps=S.prods.filter(p=>p.forn==f.id||p.offers?.some(o=>o.forn==f.id));
  return head(esc(f.name),`<button class="btn s" onclick="go('forn')">Voltar</button>`)+`<div class="card"><div class="grid g2">${FF.slice(1).map(([k,l])=>`<div><span class="mu">${l}</span><br>${esc(f[k])||"-"}</div>`).join("")}<div><span class="mu">Tipo</span><br>${f.tipo}</div></div><p class="mu">${esc(f.obs)}</p></div><div class="card tw" style="margin-top:14px"><h3>Produtos vinculados</h3><table><tr><th>Produto</th><th>Custo</th><th>Cotação deste fornecedor</th><th>Margem</th></tr>${ps.map(p=>`<tr><td>${esc(p.name)}</td><td>${brl(p.cost)}</td><td>${(p.offers||[]).filter(o=>o.forn==f.id).map(o=>brl(o.price)).join(", ")||"-"}</td><td>${pc(calc(p).margin)}</td></tr>`).join("")||`<tr><td colspan="4" class="mu">Sem produtos vinculados.</td></tr>`}</table></div>`};
/* purchases */
V.comp=()=>head("Compras",`<button class="btn" onclick="go('compf',null)"><i data-lucide="plus"></i>Registrar compra</button>`)+`<div class="card tw"><table><tr><th>Data</th><th>Fornecedor</th><th>Itens</th><th>Frete</th><th>Impostos</th><th>Total</th><th>Entrega</th><th>Status</th><th></th></tr>${S.comp.map(c=>`<tr><td>${esc(c.date)}</td><td>${esc(fn(c.forn))}</td><td>${c.items.map(i=>esc(S.prods.find(p=>p.id==i.pid)?.name||"?")+" ×"+i.qty).join(", ")}</td><td>${brl(c.freight)}</td><td>${brl(c.tax)}</td><td>${brl(ctot(c))}</td><td>${esc(c.eta)}</td><td><span class="tag">${c.status}</span></td><td><button class="btn d sm" onclick="del('comp','${c.id}')"><i data-lucide="trash-2"></i></button></td></tr>`).join("")||`<tr><td colspan="9" class="mu">Nenhuma compra registrada.</td></tr>`}</table></div>`;
const ctot=c=>c.items.reduce((a,i)=>a+N(i.qty)*N(i.unit),0)+N(c.freight)+N(c.tax);
V.compf=()=>{const c=tmp.c||(tmp.c={items:[{pid:S.prods[0]?.id,qty:1,unit:""}],status:"Pedido feito",freight:0,tax:0,date:new Date().toISOString().slice(0,10)});
  return head("Nova compra")+`<div class="card"><div class="f"><div><label>Fornecedor<select id="c_forn">${S.forn.map(f=>`<option value="${f.id}" ${f.id==c.forn?"selected":""}>${esc(f.name)}</option>`).join("")}</select></label></div>${I("c_date","Data da compra",c.date,"date")}${I("c_eta","Previsão de entrega",c.eta||"","date")}<div><label>Status<select id="c_status">${["Pedido feito","Em trânsito","Recebida","Cancelada"].map(s=>`<option ${s==c.status?"selected":""}>${s}</option>`).join("")}</select></label></div>${I("c_freight","Frete da compra (R$)",c.freight,"number",'step="0.01" min="0" oninput="ct()"')}${I("c_tax","Impostos de aquisição (R$)",c.tax,"number",'step="0.01" min="0" oninput="ct()"')}</div>
  <h3 style="margin-top:14px">Produtos comprados</h3>${c.items.map((it,i)=>`<div class="f" style="margin-bottom:8px"><div><label>Produto<select onchange="tmp.c.items[${i}].pid=this.value">${S.prods.map(p=>`<option value="${p.id}" ${p.id==it.pid?"selected":""}>${esc(p.name)}</option>`).join("")}</select></label></div><div><label>Quantidade<input type="number" min="1" value="${it.qty}" oninput="tmp.c.items[${i}].qty=this.value;ct()"></label></div><div><label>Valor unitário<input type="number" step="0.01" min="0" value="${it.unit}" oninput="tmp.c.items[${i}].unit=this.value;ct()"></label></div></div>`).join("")}
  <button class="btn s sm" onclick="ck();tmp.c.items.push({pid:S.prods[0]?.id,qty:1,unit:''});render()">+ Produto</button>
  <p><label><input type="checkbox" id="c_rat" style="width:auto;margin-right:6px" checked>Ratear frete e impostos entre os produtos e atualizar o custo unitário</label></p>
  <div class="big"><span class="mu">Custo total do pedido</span><b id="c_tot">${brl(ctot(c))}</b></div>
  <div style="margin-top:14px;display:flex;gap:8px"><button class="btn" onclick="saveC()"><i data-lucide="save"></i>Salvar</button><button class="btn s" onclick="tmp.c=null;go('comp')">Cancelar</button></div></div>`};
function ck(){const c=tmp.c;["forn","date","eta","status","freight","tax"].forEach(k=>c[k]=$("#c_"+k)?.value)}
function ct(){ck();$("#c_tot").textContent=brl(ctot(tmp.c))}
function saveC(){ck();const c=tmp.c;if(!c.forn||!c.items.length||c.items.some(i=>!i.pid||N(i.qty)<=0||N(i.unit)<0))return toast("Preencha fornecedor e itens válidos");
  if($("#c_rat").checked){const sub=c.items.reduce((a,i)=>a+N(i.qty)*N(i.unit),0),extra=N(c.freight)+N(c.tax);c.items.forEach(i=>{const p=S.prods.find(x=>x.id==i.pid);if(!p)return;const share=sub>0?extra*(N(i.qty)*N(i.unit)/sub)/N(i.qty):0,nc=+(N(i.unit)+share).toFixed(2);p.hist=[...(p.hist||[]),{d:new Date().toLocaleDateString("pt-BR"),v:nc}];p.cost=nc})}
  c.id=uid();S.comp.push(c);save();tmp.c=null;go("comp");toast("Compra registrada")}
/* simulator */
function cmpHTML(p){const base={...p};return `<div class="grid g4">${Object.entries(PL).map(([k,n])=>{const q={...base,pct:pct(k),fixed:fix(k)},c=calc(q);return `<div class="big" style="margin:0"><span class="mu">${n}</span><b class="${c.profit>=0?"pos":"neg"}" style="font-size:18px">${brl(c.profit)}</b><span class="mu">Margem ${pc(c.margin)} · ROI ${pc(c.roi)}</span></div>`}).join("")}</div>`}
V.sim=()=>{const p=tmp.s||(tmp.s={...newP()});return head("Simulador de Margem")+`<div class="split"><div><div class="card"><div class="f"><div class="full"><label>Plataforma</label>${plSel(p.plat)}</div>${costFields(p)}</div><div style="margin-top:14px"><button class="btn" onclick="simSave()"><i data-lucide="save"></i>Salvar como produto</button></div></div><div class="card" style="margin-top:14px"><h3>Comparação lado a lado</h3><div id="cmp">${cmpHTML(p)}</div></div></div><div class="card sum" id="sum">${sumHTML(fillC(p))}</div></div>`};
function simSave(){const p={...newP(),...rd(),name:"Simulação "+new Date().toLocaleDateString("pt-BR")};tmp.s=null;S.prods.push(p);save();go("prodf",p.id);toast("Salvo como produto")}
/* reports */
V.rel=()=>{const rows=S.prods.map(p=>({p,c:calc(p)}));const by=k=>{const m={};rows.forEach(r=>{const key=k(r.p)||"Sem categoria";(m[key]=m[key]||[]).push(r.c)});return Object.entries(m)};
  const tb=(t,e)=>`<div class="card tw"><h3>${t}</h3><table><tr><th>Grupo</th><th>Produtos</th><th>Margem média</th><th>Lucro médio</th></tr>${e.map(([k,a])=>`<tr><td>${esc(k)}</td><td>${a.length}</td><td>${pc(a.reduce((x,c)=>x+c.margin,0)/a.length)}</td><td>${brl(a.reduce((x,c)=>x+c.profit,0)/a.length)}</td></tr>`).join("")||`<tr><td colspan="4" class="mu">Sem dados.</td></tr>`}</table></div>`;
  return head("Relatórios")+`<div class="grid">${tb("Por marketplace",by(p=>PL[p.plat]))}${tb("Por categoria",by(p=>p.cat))}${tb("Por fornecedor",by(p=>fn(p.forn)))}<div class="card"><h3>Produtos com prejuízo ou abaixo da margem mínima</h3>${rows.filter(r=>r.c.margin<N(S.cfg.minM)).map(r=>`<div class="row"><span>${esc(r.p.name)}</span><span class="${r.c.profit>=0?"pos":"neg"}">${pc(r.c.margin)}</span></div>`).join("")||`<p class="mu">Nenhum.</p>`}</div></div>`};
/* settings */
const CF=[["mlc","Comissão ML Clássico (%)"],["mlp","Comissão ML Premium (%)"],["shp","Comissão Shopee (%)"],["fixMl","Tarifa fixa Mercado Livre (R$)"],["fixShp","Tarifa fixa Shopee (R$)"],["tax","Impostos estimados (% sobre venda)"],["pack","Custo de embalagem padrão (R$)"],["freight","Frete estimado padrão (R$)"],["minM","Margem mínima desejada (%)"]];
V.cfg=()=>head("Configurações")+`<div class="card"><p class="mu">Valores usados como padrão em novos produtos e no simulador. Confirme as tarifas vigentes de cada marketplace e informe suas taxas da Shopee e tarifas fixas, pois variam por categoria e preço.</p><div class="f">${CF.map(([k,l])=>I("s_"+k,l,S.cfg[k],"number",'step="0.01" min="0"')).join("")}<div><label>Moeda<input value="Real brasileiro (BRL)" disabled></label></div></div><div style="margin-top:14px"><button class="btn" onclick="saveCfg()"><i data-lucide="save"></i>Salvar configurações</button></div></div>
<div class="card" style="margin-top:14px"><h3>Seus dados</h3><p class="mu">Estado: ${SYNC}. Os dados ficam salvos neste navegador (localStorage). Exporte um backup de vez em quando. Faça um backup de vez em quando.</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn s" onclick="expB()"><i data-lucide="download"></i>Exportar backup</button><label class="btn s" style="color:var(--tx);cursor:pointer;margin:0"><i data-lucide="upload"></i>Importar backup<input type="file" accept=".json,application/json" style="display:none" onchange="impB(this)"></label></div></div>`;
async function expB(){if(typeof claude==="undefined"){const u=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:"application/json"})),l=document.createElement("a");l.href=u;l.download="meunegocio-backup.json";document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);return toast("Backup exportado")}try{const d=await claude.use("downloads");if(!d)return toast("Exportação indisponível aqui");await d.save({filename:"meunegocio-backup.json",data:JSON.stringify(S)});toast("Backup exportado")}catch(e){toast("Backup cancelado")}}
function impB(el){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!Array.isArray(o.prods)||!Array.isArray(o.forn)||!Array.isArray(o.comp))throw 0;if(!confirm("Substituir todos os dados atuais pelos do backup?"))return;S={prods:o.prods,forn:o.forn,comp:o.comp,cfg:{...DEF,...(o.cfg||{})}};save();render();toast("Backup importado")}catch(e){toast("Arquivo de backup inválido")}};r.readAsText(f)}
function saveCfg(){CF.forEach(([k])=>S.cfg[k]=Math.max(0,N($("#s_"+k).value)));save();toast("Configurações salvas")}
$("#sb").addEventListener("click",e=>{if(e.target.id==="sb"){collapsed=!collapsed;render()}});
document.addEventListener("click",e=>{if(!collapsed&&innerWidth<860&&!e.target.closest("aside,#mb")){collapsed=true;render()}});
render();
</script></body></html>
